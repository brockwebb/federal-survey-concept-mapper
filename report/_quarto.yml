project:
  type: default
  output-dir: _output
  pre-render: python ../src/validation/validate_complete.py

format:
  pdf:
    documentclass: article
    papersize: letter
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    linkcolor: "blue"
    geometry:
      - margin=1in
    fig-pos: "htbp"
    keep-tex: false
    linestretch: 1.15
    mainfont: "Palatino"
    include-in-header:
      text: |
        \usepackage{booktabs}
        \usepackage{authblk}
    title-block-style: default

bibliography: references.bib
csl: apa.csl
