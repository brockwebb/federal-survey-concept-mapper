# Acknowledged v1-vs-v2 prompt divergences
# ==========================================
# Consumed by v2/src/tevv/prompt_equivalence.py. A divergence the gate finds is
# treated as ACKNOWLEDGED (does not fail the gate) iff a row here matches its
# (stage, dimension, signature) AND carries a non-empty `justification`.
#
# Two fields per row carry different epistemic weight:
#   justification     -- WHAT changed and WHY it was (or was not) deliberate.
#                        Statement of design intent. Human-authored.
#   directional_bias  -- INTERPRETATION of which way the change is expected to
#                        push results. This is a hypothesis, not a measurement.
#                        It is recorded so the Stage 3 writeup can cite a
#                        reviewed human judgment rather than an ad-hoc claim in
#                        a chat transcript. REVIEW EACH ONE before trusting it.
#
# The directional_bias entries below were drafted in the planning session that
# discovered these divergences. They are PROVISIONAL pending Brock's review
# (see cc_tasks/2026-06-03_tevv_prompt_equivalence_gate.md, step 5). Until
# reviewed, treat them as a starting hypothesis.
#
# IMPORTANT: acknowledging a divergence does NOT make the v1-vs-v2 comparison
# clean. It records that the divergence is KNOWN and DELIBERATE (or known and
# tolerated). The Stage 3 flat-barrier-agreement numbers remain CONFOUNDED by
# the acknowledged divergences; the signal-stratified candidate result is the
# metric that survives them. See docs/stages/tevv/prompt_equivalence_report.md.

version: 1

acknowledged:

  - stage: stage3
    dimension: available_codes
    signature: "codes_added:NHB"
    justification: >
      v2's barrier prompt adds an explicit NHB (No Harmonization Barrier) code
      with the rule "NHB pairs are always F1". v1's barrier prompt
      (create_barrier_prompt in src/pipelines/01_barrier_pipeline.py) presumes a
      barrier exists ("identify WHY they cannot be directly consolidated") and
      offers only F1/F2/F3. The NHB code is genuinely new surface area in v2.
    directional_bias: >
      PROVISIONAL. Adding a dedicated no-barrier sink at the bottom of the
      feasibility range drains the "weak barrier but still harmonizable" cases
      out of F1/F2, leaving F1/F2 sparser and pushing genuinely hard pairs
      toward F3. Expected to inflate F3 share relative to v1 and to depress a
      v1-vs-v2 feasibility kappa simply because v1 used a 3-bucket scale and v2
      a 4-bucket scale. Direction: toward F3 at the margin.

  - stage: stage3
    dimension: output_schema
    signature: "schema_fields_added:classification"
    justification: >
      v2 adds a standalone Level-1 `classification` field (bare TC|CC|...|NHB)
      to the output schema, on top of `primary_barrier` (the L1.L2 code). v1's
      schema had only `primary_barrier`; there was no separate top-level bucket
      field. Deliberate schema change in v2 to record L1 explicitly.
    directional_bias: >
      PROVISIONAL. Forcing a top-level bucket commitment before the subtype may
      anchor the model on the broadest defensible L1 (CC, whose definition
      "concept definition or operationalization differences" absorbs most
      cases) before it reasons to a specific subtype. Hypothesized to favor CC.
      Direction: toward CC. This is a hypothesis about ordering effects, not a
      measured fact.

  - stage: stage3
    dimension: output_schema
    signature: "schema_fields_removed:additional_barriers"
    justification: >
      v1's schema included an `additional_barriers` list field, letting a rater
      log secondary barriers (e.g. primary TC.1 with additional CC.2). v2
      dropped it: the prompt demands "the SINGLE primary harmonization barrier"
      and returns one code with no secondary outlet.
    directional_bias: >
      PROVISIONAL. With no outlet for a secondary barrier, a pair that has both
      (say) a temporal and a construct difference must collapse to one code in
      v2, whereas v1 could record TC.1 primary + CC.2 additional. When forced to
      pick one, the broader category (CC) is the safer choice, so the collapse
      is hypothesized to move mass toward CC. Direction: toward CC.

  - stage: stage3
    dimension: task_framing
    signature: "framing:single_barrier_mandate"
    justification: >
      v1 frames the ask as "the main constraint preventing consolidation" and
      codes a BATCH of pairs in one prompt (JSON array, "one object per pair").
      v2 frames it as "the SINGLE primary harmonization barrier" and codes ONE
      pair per call. The one-pair-per-task structure is the intended v2
      architecture change (enables per-pair checkpoint/retry in the harness).
    directional_bias: >
      PROVISIONAL. Two effects, same direction. (a) "SINGLE" wording plus the
      dropped additional_barriers field removes the secondary outlet (see
      above). (b) Coding one pair in isolation removes the cross-pair contrast a
      batch provides; with no neighbors to differentiate against, the model is
      hypothesized to reach for the most general explanation (CC). Believed to
      be the largest single contributor to the v2 CC-attractor. Direction:
      toward CC. Magnitude unmeasured.

  # The batched_multi_pair / single_pair_object / explicit_l1_then_subtype /
  # main_constraint_phrasing framing probes also flip between v1 and v2. They
  # are facets of the same two design changes already acknowledged above
  # (single-pair architecture; explicit L1 field). They are acknowledged here
  # so the gate is green, each pointing back to the root justification.

  - stage: stage3
    dimension: task_framing
    signature: "framing:main_constraint_phrasing"
    justification: >
      Facet of the single-barrier-mandate change: v1 said "main constraint",
      v2 says "SINGLE primary barrier". Same design decision, recorded for
      completeness. See framing:single_barrier_mandate.
    directional_bias: "See framing:single_barrier_mandate (toward CC). PROVISIONAL."

  - stage: stage3
    dimension: task_framing
    signature: "framing:batched_multi_pair"
    justification: >
      Facet of the one-pair-per-task architecture: v1 batched multiple pairs in
      a single prompt, v2 sends one. Deliberate, enables per-pair checkpointing.
      See framing:single_barrier_mandate.
    directional_bias: "See framing:single_barrier_mandate (isolation favors general bucket). PROVISIONAL."

  - stage: stage3
    dimension: task_framing
    signature: "framing:single_pair_object"
    justification: >
      Facet of the one-pair-per-task architecture (v2 returns a single JSON
      object; v1 returned an array). Same decision as batched_multi_pair.
    directional_bias: "See framing:single_barrier_mandate. PROVISIONAL."

  - stage: stage3
    dimension: task_framing
    signature: "framing:additional_barriers_outlet"
    justification: >
      Facet of schema_fields_removed:additional_barriers, surfaced also as a
      framing probe. Same dropped field. See that entry.
    directional_bias: "See schema_fields_removed:additional_barriers (toward CC). PROVISIONAL."

  - stage: stage3
    dimension: task_framing
    signature: "framing:explicit_l1_then_subtype"
    justification: >
      Facet of schema_fields_added:classification (v2 asks for both a bare L1
      classification and the L1.L2 primary_barrier). Same added field.
    directional_bias: "See schema_fields_added:classification (toward CC). PROVISIONAL."

  - stage: stage3
    dimension: task_framing
    signature: "framing:nhb_offered"
    justification: >
      Facet of codes_added:NHB surfaced as a framing probe. Same added code.
    directional_bias: "See codes_added:NHB (toward F3 at margin). PROVISIONAL."

  # ===========================================================================
  # Divergences the mechanical gate surfaced beyond the four roots the planning
  # read enumerated. Each is a REAL, deliberate v2 change (confirmed by reading
  # both rendered prompts, /tmp dumps 2026-06-03), not an extractor artifact.
  # Added here per the CC task's FAIL-handling rule: acknowledge real divergences
  # with a written justification rather than loosen the gate. justification =
  # design fact (correctness-checkable); directional_bias = PROVISIONAL
  # hypothesis pending Brock's Step 5 review.
  # ===========================================================================

  # ---- bare Level-1 codes (facet of the classification field) ---------------
  # v1 offered only L1.L2 subtypes (TC.1, CC.2, ...). v2's new `classification`
  # field offers the bare L1 set (TC | CC | PC | RS | MC | PM | NHB) as a choice
  # list, so each bare L1 code surfaces in v2's available-code set. These are a
  # facet of schema_fields_added:classification, not independent new barriers.
  - stage: stage3
    dimension: available_codes
    signature: "codes_added:TC"
    justification: >
      Facet of schema_fields_added:classification. v2's new bare Level-1
      classification field offers TC as a choice; v1 had no bare-L1 field, only
      the TC.1/TC.2/TC.3 subtypes. See schema_fields_added:classification.
    directional_bias: "See schema_fields_added:classification (toward CC). PROVISIONAL."
  - stage: stage3
    dimension: available_codes
    signature: "codes_added:CC"
    justification: >
      Facet of schema_fields_added:classification. Bare CC offered as a Level-1
      choice in v2; v1 had only CC.1-CC.4 subtypes. See
      schema_fields_added:classification.
    directional_bias: "See schema_fields_added:classification (toward CC). PROVISIONAL."
  - stage: stage3
    dimension: available_codes
    signature: "codes_added:PC"
    justification: >
      Facet of schema_fields_added:classification. Bare PC offered as a Level-1
      choice in v2; v1 had only PC.1-PC.4 subtypes. See
      schema_fields_added:classification.
    directional_bias: "See schema_fields_added:classification (toward CC). PROVISIONAL."
  - stage: stage3
    dimension: available_codes
    signature: "codes_added:RS"
    justification: >
      Facet of schema_fields_added:classification. Bare RS offered as a Level-1
      choice in v2; v1 had only RS.1-RS.4 subtypes. See
      schema_fields_added:classification.
    directional_bias: "See schema_fields_added:classification (toward CC). PROVISIONAL."
  - stage: stage3
    dimension: available_codes
    signature: "codes_added:MC"
    justification: >
      Facet of schema_fields_added:classification. Bare MC offered as a Level-1
      choice in v2; v1 had only MC.1-MC.4 subtypes. See
      schema_fields_added:classification.
    directional_bias: "See schema_fields_added:classification (toward CC). PROVISIONAL."
  - stage: stage3
    dimension: available_codes
    signature: "codes_added:PM"
    justification: >
      Facet of schema_fields_added:classification. Bare PM offered as a Level-1
      choice in v2; v1 had only PM.1-PM.3 subtypes. See
      schema_fields_added:classification.
    directional_bias: "See schema_fields_added:classification (toward CC). PROVISIONAL."

  # ---- taxonomy block: NHB insertion (facet of codes_added:NHB) -------------
  - stage: stage3
    dimension: taxonomy_block
    signature: "taxonomy_block_text_differs"
    justification: >
      The Level-1, Level-2, and feasibility tables are byte-identical between v1
      and v2 (confirmed by reading both rendered prompts). The ONLY taxonomy-block
      difference is v2's appended "### Special code - NHB" subsection. This is the
      same NHB addition acknowledged under codes_added:NHB, surfaced here by the
      byte-level taxonomy-identity check. No other instructional text changed.
    directional_bias: "See codes_added:NHB (toward F3 at margin). PROVISIONAL."

  # ---- additional v2 output fields the planning read did not enumerate -------
  - stage: stage3
    dimension: output_schema
    signature: "schema_fields_added:confidence"
    justification: >
      v2 adds a `confidence` output field (0.0-1.0 calibrated confidence in the
      classification). v1 had no confidence field. Deliberate v2 addition that
      feeds the confidence-gated gold set in the downstream signal-stratified
      reproducibility analysis (stage3_v1_v2_signal_stratified.py).
    directional_bias: >
      PROVISIONAL. Metadata about the rating, not an input to choosing the code.
      Used downstream to gate a high-confidence gold set, not to select the
      barrier. Direction: none expected on the barrier-label distribution.
  - stage: stage3
    dimension: output_schema
    signature: "schema_fields_added:consolidation_potential"
    justification: >
      v2 adds a `consolidation_potential` output field (yes | no | partial:
      could QUESTION A be dropped if surveys were person-linked?). v1 passed a
      consolidation_potential value IN as context but did not ask the rater to
      EMIT one. Deliberate v2 addition capturing the redundancy/enrichment signal.
    directional_bias: >
      PROVISIONAL. Orthogonal to the barrier label; captures a downstream
      enrichment signal rather than the harmonization barrier. Direction: none
      expected on the barrier code.
  - stage: stage3
    dimension: output_schema
    signature: "schema_fields_added:reference_period_a"
    justification: >
      v2 adds a `reference_period_a` output field asking the rater to surface the
      temporal reference of QUESTION A (or "not specified"). v1 had no such field.
      Deliberate v2 elicitation aid that makes temporal reasoning explicit.
    directional_bias: >
      PROVISIONAL. Foregrounding reference periods could prime TC (temporal)
      classifications relative to v1, which never asked for them. NOTE: this
      points toward TC, the OPPOSITE direction from the CC-attractor the other
      divergences predict. Flag for Brock: net effect is unmeasured and could
      partially offset the CC pull. Hypothesis only.
  - stage: stage3
    dimension: output_schema
    signature: "schema_fields_added:reference_period_b"
    justification: >
      v2 adds a `reference_period_b` output field asking the rater to surface the
      temporal reference of QUESTION B (or "not specified"). v1 had no such field.
      Same deliberate elicitation aid as reference_period_a.
    directional_bias: >
      PROVISIONAL. See reference_period_a: possibly toward TC at the margin, the
      opposite direction from the CC-attractor. Unmeasured. Flag for Brock.

  # ---- additional v1 output field v2 dropped --------------------------------
  - stage: stage3
    dimension: output_schema
    signature: "schema_fields_removed:specific_conflict"
    justification: >
      v1's schema included a `specific_conflict` free-text field (brief
      description of the exact difference). v2 dropped it; v2's `reasoning` field
      (2-3 sentences) subsumes that content. No separate specific-conflict outlet
      in v2.
    directional_bias: >
      PROVISIONAL. Free-text descriptive field, not a coded outlet. Its removal is
      not expected to move the barrier-label distribution (unlike the dropped
      additional_barriers field, which WAS a coded secondary outlet). Direction:
      none expected.
