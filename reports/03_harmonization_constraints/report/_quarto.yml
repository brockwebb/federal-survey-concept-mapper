project:
  type: book
  output-dir: _output

book:
  title: "Survey Question Harmonization Constraints"
  subtitle: "AI-Assisted Analysis of Federal Survey Consolidation Potential"
  author: "Brock Webb"
  date: today
  chapters:
    - index.qmd
    - sections/00_executive_summary.md
    - sections/01_introduction.md
    - sections/02_background.md
    - sections/03_methodology.md
    - sections/04_results.md
    - sections/05_discussion.md
    - sections/06_conclusion.md
    - part: "Appendices"
      chapters:
        - sections/07a_taxonomy_definitions.md
        - sections/07b_methodology_decisions.md
        - sections/07c_expert_review_tables.md

bibliography: references.bib
csl: apa.csl

format:
  pdf:
    documentclass: report
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    margin-left: 1in
    margin-right: 1in
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
