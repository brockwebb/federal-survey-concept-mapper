project:
  type: book
  output-dir: _output

book:
  title: "Question-Level Survey Consolidation Analysis"
  subtitle: "Federal Survey Concept Mapper Project"
  author: "Brock Webb"
  date: today
  chapters:
    - index.qmd
    - sections/00_overview.md
    - sections/01_survey_selection.md
    - sections/02_concept_overlap.md
    - sections/03_methodology.md
    - sections/04_results.md
    - part: "Case Studies"
      chapters:
        - sections/05_case_study_foodaps.md
        - sections/05_case_study_cps.md
    - sections/06_synthesis.md
    - sections/07_future_work.md

format:
  pdf:
    documentclass: report
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    margin-left: 1in
    margin-right: 1in
    margin-top: 1in
    margin-bottom: 1in
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true

# Mermaid diagrams render natively
diagram:
  mermaid:
    theme: default
