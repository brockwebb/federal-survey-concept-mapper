project:
  type: book
  output-dir: _output

book:
  title: "LLM-Assisted Concept Mapping of Federal Survey Questions"
  subtitle: "Federal Survey Harmonization Research — Report 01"
  date: today
  chapters:
    - index.qmd
    - sections/00_executive_summary.md
    - sections/01_abstract.md
    - sections/02_introduction.md
    - sections/03_background.md
    - sections/04_methodology.md
    - sections/05_data_collection.md
    - sections/06_categorization_approach.md
    - sections/07_results.md
    - sections/08_coverage_analysis.md
    - sections/09_consolidation_opportunities.md
    - sections/10_discussion.md
    - sections/11_limitations.md
    - sections/12_recommendations.md
    - sections/13_conclusion.md
    - part: "Appendices"
      chapters:
        - sections/14_appendices.md
        - sections/references.md

format:
